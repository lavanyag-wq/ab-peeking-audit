name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools experiments

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests as their own step
        run: >
          pytest --junitxml=reports/junit.xml
          --cov=ab_peeking_audit
          --cov-report=json:reports/coverage.json
          --cov-report=xml:reports/coverage.xml
      - name: Coverage floor
        run: |
          python - << 'PY'
          import json
          pct = json.load(open("reports/coverage.json"))["totals"]["percent_covered"]
          floor = 95.0
          print(f"line coverage {pct:.1f}% (floor {floor}%)")
          raise SystemExit(0 if pct >= floor else 1)
          PY

  receipts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (machine-readable reports for the collector)
        run: >
          pytest --junitxml=reports/junit.xml
          --cov=ab_peeking_audit
          --cov-report=json:reports/coverage.json
      - name: Re-run every experiment from scratch
        run: make experiments
      - name: Collect metrics from the reports just produced
        run: python tools/collect_metrics.py --skip-tests --skip-experiments
      - name: Fail on any stale published number
        run: python tools/check_numbers.py
      - name: Regenerate the diagram and charts; fail on any drift from the committed SVGs
        run: |
          python tools/render_diagram.py
          python tools/render_charts.py
          git diff --exit-code docs/diagram.svg docs/chart-inflation.svg docs/chart-power.svg
      - name: Publish the awkward table to the job summary
        run: |
          python - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          infl = json.load(open("docs/experiments/inflation.json"))
          cost = json.load(open("docs/experiments/correction_cost.json"))
          print("### Measured false positive rates (nominal alpha 0.05)")
          print("")
          print("| policy | peeks | FPR | exact 95% CI | verdict |")
          print("| --- | ---: | ---: | --- | --- |")
          for r in infl["rows"]:
              print(f"| {r['policy']} | {r['peeks']} | {r['fpr_pct']}% | "
                    f"[{r['ci_low_pct']}%, {r['ci_high_pct']}%] | {r['verdict']} |")
          print("")
          print(f"honest daily boundary z* {cost['z_star']}: held-out FPR "
                f"{cost['holdout_fpr_pct']}%, power cost {cost['power_cost_points']} "
                f"points vs one look")
          PY
      - name: Upload experiment JSON and reports
        uses: actions/upload-artifact@v4
        with:
          name: experiments-and-reports
          path: |
            docs/experiments/
            docs/metrics.json
            reports/
