[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-peeking-audit"
version = "0.1.0"
description = "An A/B test procedure auditor that measures the false positive rate a final p-value structurally cannot report"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lavanya Gurrapu", email = "lavanya.g@mycvcareer.com"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "statsmodels>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
peek-audit = "ab_peeking_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
